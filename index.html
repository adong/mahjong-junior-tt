<title>TT Mahjong Junior · Teddy &amp; Tommy</title>
<!-- The game's icon: the same emoji as its card on the dashboard, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%23f1c453'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%8E%B4%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('🎴', '#f1c453');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #ffd400;
    --gold: #f1c453;
    --red: #d8322a;
    --pink: #ff3d7f;
    --cyan: #18d4ff;
    --jade: #1f8f62;
    --felt: #1e7a4c;
    --blue: #2f7cf0;
    --orange: #ff8a1f;
    --ink: #14121f;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif;
    --pad: max(12px, env(safe-area-inset-left));
    /* the kit's ? and language buttons (js/keys.js): the middle of the left edge (the boys' strip), but on a tall screen
       in a game the bottom left corner (the boys' strip there), and on a tall title the top left corner */
    --kh-top: calc(50% - 20px);
    --kl-top: calc(50% + 28px);
  }
  body[data-tall="1"][data-screen="play"] { --kh-top: calc(100% - 104px - env(safe-area-inset-bottom)); --kl-top: calc(100% - 56px - env(safe-area-inset-bottom)); }
  body[data-tall="1"][data-screen="home"] { --kh-top: max(10px, env(safe-area-inset-top)); --kl-top: calc(max(10px, env(safe-area-inset-top)) + 48px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; color: #fff;
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* the room: a warm red wall with a gold window lattice (回 shapes) */
  body {
    background:
      linear-gradient(90deg, rgba(241, 196, 83, 0.13) 0 3px, transparent 3px) 0 0 / 46px 46px,
      linear-gradient(0deg, rgba(241, 196, 83, 0.13) 0 3px, transparent 3px) 0 0 / 46px 46px,
      linear-gradient(90deg, transparent 13px, rgba(241, 196, 83, 0.1) 13px 16px, transparent 16px 30px, rgba(241, 196, 83, 0.1) 30px 33px, transparent 33px) 0 0 / 46px 46px,
      radial-gradient(ellipse at 50% 40%, #a8392a, #6e1e16);
    background-color: #7a2a1c;
  }
  #game, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #game { z-index: 2; }
  #fx { pointer-events: none; z-index: 8; }
  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }
  .gone { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  /* ---------- big chunky buttons ---------- */
  .bigbtn {
    min-width: clamp(78px, 13vmin, 112px); height: clamp(78px, 13vmin, 112px); border-radius: 28px; padding: 0 18px;
    font-size: clamp(40px, 7vmin, 58px); line-height: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(160deg, #ffffff, #fff0d6); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink); color: var(--ink);
    transition: transform 0.08s;
  }
  .bigbtn.go { background: linear-gradient(160deg, #ff6a4d, #d8322a); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .bigbtn .word { font-family: var(--display); font-size: clamp(22px, 4.4vmin, 36px); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); color: #fff; }
  .bigbtn:active, .seg button:active, .ibtn:active, .claimbtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .ibtn {
    width: clamp(52px, 8vmin, 72px); height: clamp(52px, 8vmin, 72px); border-radius: 20px; font-size: clamp(26px, 4.4vmin, 36px); line-height: 1;
    display: grid; place-items: center; background: rgba(255, 255, 255, 0.92); border: 4px solid #fff; box-shadow: 0 5px 0 var(--ink); color: var(--ink);
  }

  /* ---------- home ---------- */
  #home { position: fixed; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.8vh, 16px); transition: opacity 0.3s; padding: 12px; }
  body[data-tall="0"] #home { left: 52vw; right: max(10px, env(safe-area-inset-right)); top: 0; bottom: 0; }
  body[data-tall="1"] #home { left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); height: 58vh; justify-content: flex-start; padding: 6px 10px; }
  .logo { text-align: center; font-family: var(--display); line-height: 0.92; transform: rotate(-3deg); }
  .logo small { display: block; font-size: clamp(26px, 5vmin, 44px); color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .logo big { display: block; font-size: clamp(34px, 7vmin, 70px); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--jade), 0 10px 0 var(--ink), 0 14px 24px rgba(0,0,0,.25); letter-spacing: 1px; white-space: nowrap; }
  .tagline { font-family: var(--display); font-size: clamp(13px, 2.3vmin, 19px); color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-align: center; margin-top: 2px; max-width: 30em; }
  .opts { display: flex; flex-direction: column; align-items: center; gap: clamp(7px, 1.4vh, 12px); }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .seg button {
    display: flex; align-items: center; gap: 7px; height: clamp(48px, 7.6vmin, 64px); padding: 0 14px 0 9px; border-radius: 20px; border: 4px solid #fff;
    background: rgba(255, 255, 255, 0.72); box-shadow: 0 5px 0 var(--ink); color: var(--ink); font-family: var(--display); font-size: clamp(13px, 2.5vmin, 21px); transition: transform 0.12s;
  }
  .seg button img { height: 80%; aspect-ratio: 1; border-radius: 14px; background: radial-gradient(circle at 50% 35%, #ffffff, #b9e6ff); }
  .seg button .emo { font-size: 1.35em; line-height: 1; display: grid; place-items: center; }
  .seg button.on { background: linear-gradient(160deg, #fffbe0, #ffd84a); border-color: var(--yellow); box-shadow: 0 0 0 4px var(--ink), 0 6px 0 4px var(--ink); transform: scale(1.06); }
  .duo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: clamp(15px, 2.8vmin, 24px); color: var(--ink); background: rgba(255,255,255,.72); border: 4px solid #fff; border-radius: 22px; padding: 4px 14px 4px 6px; box-shadow: 0 5px 0 var(--ink); }
  .duo img { width: clamp(40px, 6.4vmin, 56px); aspect-ratio: 1; border-radius: 14px; background: radial-gradient(circle at 50% 35%, #ffffff, #b9e6ff); }
  /* who else is at the table */
  .friends { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: clamp(12px, 2.1vmin, 17px); color: #fff; -webkit-text-stroke: 1.2px var(--ink); paint-order: stroke fill; }
  .friends span.f { width: clamp(34px, 5.6vmin, 46px); height: clamp(34px, 5.6vmin, 46px); border-radius: 50%; background: radial-gradient(circle at 50% 35%, #ffffff, #e2ffe8); border: 3px solid var(--ink); display: grid; place-items: center; font-size: clamp(20px, 3.4vmin, 28px); -webkit-text-stroke: 0; }
  .playrow { display: flex; align-items: center; gap: 14px; }
  #goPlay { min-width: clamp(170px, 30vmin, 260px); height: clamp(62px, 10vmin, 86px); font-size: clamp(30px, 5vmin, 44px); }
  #storyBtn { width: clamp(56px, 9vmin, 78px); height: clamp(56px, 9vmin, 78px); }
  @media (max-height: 520px) {
    /* a phone on its side: everything a size smaller so it all fits */
    #home { gap: 5px; padding: 4px 8px; }
    .logo small { font-size: 16px; -webkit-text-stroke-width: 2px; text-shadow: 0 2px 0 var(--ink); }
    .logo big { font-size: 26px; text-shadow: 0 3px 0 var(--jade), 0 5px 0 var(--ink); -webkit-text-stroke-width: 3px; }
    .tagline { display: none; }
    .opts { gap: 6px; }
    .seg { gap: 5px; }
    .seg button { height: 38px; font-size: 12px; border-radius: 13px; padding: 0 8px 0 5px; border-width: 3px; box-shadow: 0 3px 0 var(--ink); }
    .seg button.on { box-shadow: 0 0 0 3px var(--ink), 0 4px 0 3px var(--ink); transform: none; }
    .duo { font-size: 13px; padding: 2px 10px 2px 4px; border-width: 3px; }
    .duo img { width: 32px; }
    .friends span.f { width: 28px; height: 28px; font-size: 17px; }
    #goPlay { height: 50px; min-width: 150px; font-size: 26px; border-radius: 20px; }
    #storyBtn { width: 50px; height: 50px; font-size: 24px; border-radius: 16px; }
  }
  @media (max-width: 430px) {
    .seg { gap: 6px; }
    .seg button { padding: 0 8px 0 5px; gap: 4px; font-size: 12px; height: 44px; border-radius: 15px; border-width: 3px; }
    .seg button .emo { font-size: 1.2em; }
    .logo big { font-size: 30px; }
    .tagline { display: none; }
    #goPlay { height: 62px; }
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 6; transition: opacity 0.3s; }
  .hudtop { position: absolute; left: var(--pad); right: max(12px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .hudtop button { pointer-events: auto; flex-shrink: 0; }
  .hudmid { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 0; padding-top: 4px; }
  #status { font-family: var(--display); font-size: clamp(14px, 2.6vmin, 24px); color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); text-align: center; max-width: 100%; line-height: 1.15; }
  #status.you { color: var(--yellow); }
  #roundInfo { font-family: var(--display); font-size: clamp(10px, 1.8vmin, 14px); color: #ffe7b8; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  @keyframes bump { 40% { transform: scale(1.45) rotate(-6deg); } }
  @keyframes nudge { 50% { transform: scale(1.06); } }
  @media (max-width: 520px) { .ibtn { width: 46px; height: 46px; font-size: 22px; border-radius: 14px; border-width: 3px; } }
  @media (max-height: 520px) { .ibtn { width: 42px; height: 42px; font-size: 21px; border-radius: 13px; border-width: 3px; } #status { font-size: 13px; } #roundInfo { display: none; } }

  /* the seats: a face, a name and points, round the table; a gold ring for whose turn it is */
  .seat { position: fixed; z-index: 6; pointer-events: none; display: flex; align-items: center; gap: 5px; padding: 3px 9px 3px 3px; border-radius: 999px; background: rgba(20, 18, 31, 0.72); border: 3px solid #fff; transition: transform 0.2s, border-color 0.2s; white-space: nowrap; }
  .seat .face { width: clamp(28px, 4.6vmin, 40px); height: clamp(28px, 4.6vmin, 40px); border-radius: 50%; display: grid; place-items: center; font-size: clamp(18px, 3vmin, 26px); background: radial-gradient(circle at 50% 35%, #ffffff, #e2ffe8); overflow: hidden; }
  .seat .face img { width: 100%; height: 100%; object-fit: cover; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); }
  .seat .who { display: flex; flex-direction: column; line-height: 1; }
  .seat .nm { font-family: var(--display); font-size: clamp(10px, 1.8vmin, 14px); color: #fff; }
  .seat .pts { font-family: var(--display); font-size: clamp(11px, 2vmin, 16px); color: var(--yellow); }
  .seat .wind { font-family: var(--display); font-size: clamp(10px, 1.7vmin, 13px); color: var(--ink); background: #fffaf0; border-radius: 6px; padding: 1px 4px; margin-left: 2px; }
  .seat .wind.east { background: var(--red); color: #fff; }
  .seat .think { font-size: clamp(12px, 2vmin, 16px); display: none; }
  .seat.turn { border-color: var(--yellow); box-shadow: 0 0 16px 4px rgba(255, 212, 0, 0.7); }
  .seat.turn .think { display: inline; animation: nudge 0.8s ease-in-out infinite; }
  .seat.human.turn .think { display: none; }
  .seat.won { animation: spin 0.9s ease-in-out 3; border-color: #7df7c8; }
  @media (max-width: 520px), (max-height: 430px) { .seat { padding: 2px 6px 2px 2px; gap: 3px; border-width: 2px; } .seat .wind { display: none; } .seat .nm { font-size: 9px; } .seat .pts { font-size: 11px; } .seat .face { width: 26px; height: 26px; font-size: 17px; } }
  @keyframes spin { 50% { transform: scale(1.35) rotate(12deg); } }
  /* the burst over a seat when it calls out (CHOW! PUNG! HÚ!) */
  .callout { position: fixed; z-index: 9; pointer-events: none; font-family: var(--display); font-size: clamp(26px, 5vmin, 46px); color: var(--yellow); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--red); transform: translate(-50%, -50%); animation: toast 1.4s ease-out forwards; white-space: nowrap; }

  /* the claim buttons: take the tile on offer (or win), or pass */
  #claims { position: fixed; z-index: 7; display: flex; gap: clamp(6px, 1.4vmin, 12px); align-items: stretch; justify-content: center; transform: translate(-50%, -100%); pointer-events: auto; flex-wrap: wrap; max-width: 96vw; }
  #claims.below { transform: translate(-50%, 0); }
  .claimbtn {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: clamp(70px, 11vmin, 104px); padding: 6px 10px; border-radius: 20px;
    background: linear-gradient(160deg, #ffffff, #fff0d6); border: 4px solid #fff; box-shadow: 0 6px 0 var(--ink); color: var(--ink); font-family: var(--display); font-size: clamp(14px, 2.6vmin, 22px); line-height: 1;
  }
  .claimbtn .tiles { display: flex; gap: 1px; }
  .claimbtn .tiles img { width: clamp(20px, 3.4vmin, 30px); border-radius: 4px; box-shadow: 0 2px 0 #1f8f62; background: #fbf3dc; }
  .claimbtn.win { background: linear-gradient(160deg, #ff6a4d, #d8322a); color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; font-size: clamp(22px, 4.4vmin, 38px); min-width: clamp(100px, 17vmin, 160px); animation: nudge 0.9s ease-in-out infinite; }
  .claimbtn.pung, .claimbtn.chow { background: linear-gradient(160deg, #fffbe0, #ffd84a); }
  .claimbtn.pass { background: rgba(255, 255, 255, 0.86); font-size: clamp(13px, 2.3vmin, 19px); }
  .claimbtn.focus { outline: 4px solid var(--cyan); outline-offset: 2px; }
  .claimbtn.hint { box-shadow: 0 0 22px 8px rgba(255, 216, 74, 0.95), 0 6px 0 var(--ink); border-color: var(--yellow); }
  .claimbtn kbd { position: absolute; left: -8px; top: -8px; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 8px; background: #fff; color: var(--ink); font: 400 14px/22px var(--display); text-align: center; border: 3px solid var(--ink); -webkit-text-stroke: 0; }
  @media (hover: none) and (pointer: coarse) { .claimbtn kbd, .callbtn kbd { display: none; } }
  @media (max-height: 520px) { .claimbtn { padding: 4px 8px; border-width: 3px; border-radius: 14px; min-width: 60px; } .claimbtn.win { font-size: 20px; min-width: 84px; } .claimbtn .tiles img { width: 18px; } }

  /* your brother's button (1 player) / the high five (2 players): bottom right, big */
  .callbtn {
    position: fixed; z-index: 7; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
    width: clamp(76px, 13vmin, 116px); aspect-ratio: 1; border-radius: 50%; padding: 6px;
    background: linear-gradient(135deg, #ffb02e, #ff7a1a); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink);
    display: grid; place-items: center; font-size: clamp(40px, 7.4vmin, 60px); line-height: 1;
  }
  .callbtn img { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); }
  .callbtn #callEmoji:empty { display: none; }
  .callbtn kbd { position: absolute; left: -6px; top: -6px; width: 34px; height: 34px; border-radius: 10px; background: #fff; color: var(--ink); font: 400 18px/30px var(--display); text-align: center; border: 3px solid var(--ink); }
  .callbtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .callbtn.here { animation: glow 1.1s ease-in-out infinite; border-color: var(--yellow); }
  @keyframes glow { 50% { box-shadow: 0 0 30px 8px rgba(255, 212, 0, 0.9), 0 7px 0 var(--ink); } }
  @media (max-height: 520px) { .callbtn { width: 64px; border-width: 4px; } }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; left: 50%; top: 24%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 9; width: 96vw; }
  .toast {
    font-family: var(--display); font-size: clamp(18px, 3.6vmin, 34px); color: var(--yellow); max-width: 94vw; text-align: center;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: toast 1.9s ease-out forwards;
  }
  .toast.save { color: #7ff4ff; font-size: clamp(20px, 4.4vmin, 40px); animation-duration: 2.8s; }
  .toast.treat { color: #fff; }
  .toast.buddy { color: #ffb02e; }
  .toast.name { color: #fff; font-size: clamp(20px, 4.2vmin, 40px); animation-duration: 1.5s; }
  .toast.learn { color: #b9ffcf; }
  .toast.nope { color: #ffb4a8; }
  @keyframes toast { 0% { transform: scale(0.4); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
  .callout { animation-name: callout; }
  @keyframes callout { 0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 25% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -90%); opacity: 0; } }

  /* ---------- overlays: the result, pause, the story ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(20, 18, 31, 0.35); transition: opacity 0.25s; padding: 12px; }
  .panel { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.4vh, 14px); padding: clamp(14px, 3vmin, 30px); border-radius: 36px; background: linear-gradient(170deg, #fffaf0, #ffe4b8); border: 6px solid #fff; box-shadow: 0 0 0 4px var(--red), 0 10px 0 4px var(--ink); color: var(--ink); max-width: 96vw; max-height: 96vh; overflow: auto; }
  .rface { display: flex; align-items: center; gap: 14px; }
  .rface img, .rface .emoface { width: clamp(60px, 12vmin, 104px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); border: 5px solid var(--blue); box-shadow: 0 4px 0 var(--ink); animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); }
  .rface img.tommy { border-color: var(--orange); }
  .rface .emoface { display: grid; place-items: center; font-size: clamp(40px, 8vmin, 66px); border-color: var(--jade); background: radial-gradient(circle at 50% 35%, #ffffff, #e2ffe8); }
  @keyframes pop { from { transform: scale(0.3); } }
  .rtitle { font-family: var(--display); font-size: clamp(26px, 5.6vmin, 52px); line-height: 1.05; text-align: center; color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); max-width: 88vw; }
  .rsub { font-family: var(--display); font-size: clamp(13px, 2.5vmin, 20px); text-align: center; color: #7a3a1a; }
  .rsub:empty { display: none; }
  /* the winning hand: its sets apart, shown sets on a little green mat */
  .rhand { display: flex; gap: clamp(5px, 1.2vmin, 12px); flex-wrap: wrap; justify-content: center; }
  .rhand:empty { display: none; }
  .rhand .grp { display: flex; gap: 1px; padding: 3px; border-radius: 8px; }
  .rhand .grp.shown { background: rgba(31, 143, 98, 0.25); }
  .rhand img { width: clamp(26px, 4.6vmin, 42px); border-radius: 5px; box-shadow: 0 3px 0 #1f8f62; background: #fbf3dc; }
  .rhand img.last { outline: 3px solid var(--pink); outline-offset: 1px; }
  .rpts { display: flex; gap: 6px 10px; flex-wrap: wrap; justify-content: center; font-family: var(--display); font-size: clamp(12px, 2.2vmin, 17px); }
  .rpts:empty { display: none; }
  .rpts span { background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 2px 10px; }
  .rpts span.total { background: var(--yellow); }
  .rtable { display: flex; gap: clamp(8px, 2vmin, 18px); flex-wrap: wrap; justify-content: center; }
  .rtable .row { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: clamp(13px, 2.3vmin, 19px); background: rgba(255,255,255,.7); border-radius: 999px; padding: 2px 10px 2px 2px; border: 3px solid #fff; }
  .rtable .row.win { background: var(--yellow); border-color: var(--ink); }
  .rtable .row img, .rtable .row .e { width: clamp(28px, 4.6vmin, 38px); height: clamp(28px, 4.6vmin, 38px); border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); display: grid; place-items: center; font-size: clamp(18px, 3vmin, 24px); }
  .rbtns { display: flex; gap: clamp(14px, 3vmin, 26px); align-items: center; flex-wrap: wrap; justify-content: center; }
  #pause .panel { flex-direction: row; gap: 20px; flex-wrap: wrap; justify-content: center; }
  @media (max-height: 430px) { .panel { gap: 5px; padding: 8px 18px; } .rface img, .rface .emoface { width: 48px; } .bigbtn { height: 54px; min-width: 54px; font-size: 26px; border-radius: 18px; } .bigbtn .word { font-size: 20px; } .rtitle { font-size: 24px; } .rhand img { width: 24px; } }
  /* the story card */
  #story .panel { width: min(660px, 96vw); text-align: center; }
  .shead { font-family: var(--display); font-size: clamp(20px, 4.4vmin, 34px); color: var(--red); }
  .sart { font-size: clamp(44px, 10vmin, 84px); line-height: 1.1; letter-spacing: 6px; min-height: 1.1em; }
  .stext { font-size: clamp(16px, 3vmin, 23px); line-height: 1.45; font-weight: 700; max-width: 34em; min-height: 4.4em; }
  .sdots { display: flex; gap: 8px; }
  .sdots i { width: 12px; height: 12px; border-radius: 50%; background: #e7c9a0; border: 2px solid var(--ink); }
  .sdots i.on { background: var(--red); }
  @media (max-height: 430px) { .sart { font-size: 36px; } .stext { font-size: 14px; min-height: 0; } .shead { font-size: 18px; } }

  #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #7a2a1c; font-size: 80px; transition: opacity 0.4s; }
  #loading span { animation: bump 0.8s infinite; display: inline-block; }
  @media (prefers-reduced-motion: reduce) { .callbtn.here, .claimbtn.win, .seat.turn .think { animation: none; } }
</style>
</head>

<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<!-- home -->
<div id="home" class="hidden">
  <div class="logo" id="logo"><small></small><big></big></div>
  <div class="tagline" id="tagline">MAKE FOUR SETS AND A PAIR, THEN SHOUT HÚ!</div>
  <div class="opts">
    <div class="seg" id="segMode" role="radiogroup" aria-label="Who plays">
      <button data-v="solo" title="1 player (1)"><span class="emo">👤</span>1 PLAYER</button>
      <button data-v="two" title="2 players (2)"><span class="emo">👥</span>2 PLAYERS</button>
    </div>
    <div class="seg" id="segWho" role="radiogroup" aria-label="Who are you?">
      <button data-v="teddy" title="Teddy (W)"><img alt="" draggable="false">TEDDY</button>
      <button data-v="tommy" title="Tommy (W)"><img alt="" draggable="false">TOMMY</button>
    </div>
    <div class="duo" id="duo" style="display:none"><img id="duoA" alt="" draggable="false">TEDDY & TOMMY<img id="duoB" alt="" draggable="false"></div>
    <div class="seg" id="segLevel" role="radiogroup" aria-label="Level">
      <button data-v="easy" title="Easy (L)"><span class="emo">🐣</span>EASY</button>
      <button data-v="normal" title="Normal (L)"><span class="emo">🔥</span>NORMAL</button>
    </div>
    <div class="friends" id="friends"></div>
  </div>
  <div class="playrow">
    <button class="ibtn" id="storyBtn" title="The story (B)" aria-label="The story">📜</button>
    <button class="bigbtn go" id="goPlay" title="Play (Enter)" aria-label="Play"><span class="word">PLAY</span>▶</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hudtop">
    <button class="ibtn" id="pauseBtn" title="Pause (P)" aria-label="Pause">⏸️</button>
    <div class="hudmid">
      <div id="status"></div>
      <div id="roundInfo"></div>
    </div>
    <button class="ibtn" id="muteBtn" title="Sound (M)" aria-label="Sound on or off">🔊</button>
  </div>
</div>
<div class="seat gone" id="seat0"><span class="face"></span><span class="who"><span class="nm"></span><span class="pts"></span></span><span class="wind"></span><span class="think">💭</span></div>
<div class="seat gone" id="seat1"><span class="face"></span><span class="who"><span class="nm"></span><span class="pts"></span></span><span class="wind"></span><span class="think">💭</span></div>
<div class="seat gone" id="seat2"><span class="face"></span><span class="who"><span class="nm"></span><span class="pts"></span></span><span class="wind"></span><span class="think">💭</span></div>
<div class="seat gone" id="seat3"><span class="face"></span><span class="who"><span class="nm"></span><span class="pts"></span></span><span class="wind"></span><span class="think">💭</span></div>
<div id="claims" class="gone"></div>
<button class="callbtn hidden" id="callBtn" aria-label="Call your brother" title="Call your brother (T)"><img id="callFace" alt=""><span id="callEmoji"></span><kbd>T</kbd></button>

<div id="toasts"></div>

<!-- the round is over -->
<div id="gameOver" class="overlay hidden">
  <div class="panel">
    <div class="rface" id="oFace"></div>
    <div class="rtitle" id="oTitle"></div>
    <div class="rsub" id="oSub"></div>
    <div class="rhand" id="oHand"></div>
    <div class="rpts" id="oPts"></div>
    <div class="rtable" id="oTable"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="oAgain" aria-label="Play again"><span class="word">PLAY AGAIN</span></button>
      <button class="bigbtn" id="oHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<!-- pause -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <button class="bigbtn go" id="pResume" aria-label="Keep playing">▶</button>
    <button class="bigbtn" id="pRestart" aria-label="Deal again">🔄</button>
    <button class="bigbtn" id="pHome" aria-label="Home">🏠</button>
  </div>
</div>

<!-- the story -->
<div id="story" class="overlay hidden">
  <div class="panel">
    <div class="shead" id="sHead">MAHJONG FROM CHINA</div>

</div>
